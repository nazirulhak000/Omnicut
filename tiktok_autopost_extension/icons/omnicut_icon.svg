<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D1A"/>
      <stop offset="100%" style="stop-color:#1A0D2E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="100%" style="stop-color:#FF0050"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Outer ring (O) — gradient stroke -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="44"/>

  <!-- Inner dark fill circle to make hollow O look -->
  <circle cx="256" cy="256" r="112" fill="#0D0D1A"/>

  <!-- Cyan play triangle centered -->
  <polygon
    points="228,216 228,296 308,256"
    fill="#00F5FF"
    filter="url(#softGlow)"
  />

  <!-- Pink diagonal slash (cut indicator) — top-right accent -->
  <line x1="348" y1="128" x2="420" y2="200"
    stroke="#FF0050" stroke-width="22" stroke-linecap="round"
    filter="url(#softGlow)"
  />
  <line x1="340" y1="140" x2="412" y2="140"
    stroke="#FF0050" stroke-width="14" stroke-linecap="round" opacity="0.5"
  />

  <!-- Small dot accent bottom-left -->
  <circle cx="136" cy="376" r="18" fill="#00F5FF" opacity="0.6"/>
  <circle cx="108" cy="404" r="10" fill="#FF0050" opacity="0.4"/>
</svg>
