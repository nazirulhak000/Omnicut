<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: 'Prompt', -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: transparent;
      }
      
      .card-container {
        position: absolute;
        bottom: 520px;
        left: 54px;
        width: 972px;
        background: rgba(14, 18, 27, 0.88);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1.5px solid rgba(255, 255, 255, 0.18);
        border-radius: 36px;
        padding: 40px 48px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        color: #ffffff;
        transform: translateY(120px);
        opacity: 0;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 18px;
      }

      .product-title {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .badge-tag {
        background: rgba(255, 230, 0, 0.15);
        border: 1px solid #FFE600;
        color: #FFE600;
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .specs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .spec-pill {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 18px 22px;
        gap: 16px;
        opacity: 0;
        transform: scale(0.92);
      }

      .spec-icon {
        font-size: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .spec-text {
        display: flex;
        flex-direction: column;
      }

      .spec-label {
        font-size: 19px;
        color: #94A3B8;
        font-weight: 600;
      }

      .spec-value {
        font-size: 26px;
        color: #F8FAFC;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div class="card-container" id="specCard">
        <div class="card-header">
          <div class="product-title">{{PRODUCT_NAME}}</div>
          <div class="badge-tag">OFFICIAL SPECS</div>
        </div>
        <div class="specs-grid">
          {{SPECS_GRID_HTML}}
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      
      tl.to("#specCard", {
        y: 0,
        opacity: 1,
        duration: 0.8,
        ease: "power3.out"
      }, 0.2);

      tl.to(".spec-pill", {
        opacity: 1,
        scale: 1,
        duration: 0.5,
        stagger: 0.12,
        ease: "back.out(1.4)"
      }, 0.5);

      tl.to("#specCard", {
        y: 60,
        opacity: 0,
        duration: 0.6,
        ease: "power2.in"
      }, 4.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
