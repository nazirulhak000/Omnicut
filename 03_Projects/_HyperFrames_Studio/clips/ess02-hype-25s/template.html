<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/kit.css">
    <script src="kit/kit.js"></script>
    <style>
      /* ess02-hype-25s — style "Velocity Hype" (generated by clips/ess02-hype-25s/make.py — edit the generator, not this file) */
      .cam.dark {
        filter: brightness(0.55) contrast(1.15) saturate(0.8);
      }
      .w {
        top: 760px;
        line-height: 1;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      }
      .w-huge {
        top: 640px;
        font-size: 420px;
      }
      .w-big {
        font-size: 165px;
        letter-spacing: 0.02em;
      }
      .w-mid {
        font-size: 170px;
      }
      .w-th {
        top: 330px;
        font-size: 150px;
      }
      #bars-top,
      #bars-bot {
        position: absolute;
        left: 0;
        right: 0;
        height: 190px;
        background: var(--ink);
      }
      #bars-top {
        top: 0;
        transform-origin: 50% 0%;
      }
      #bars-bot {
        bottom: 0;
        transform-origin: 50% 100%;
      }
      #cta-arrow {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #cta-arrow path {
        fill: none;
        stroke: var(--volt);
        stroke-width: 22;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g6gd" id="root" data-composition-id="ess02-hype-25s" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <div data-hf-id="hf-snx7" id="stage" style="position: absolute; inset: 0">
{{CAMS}}

      <!-- letterbox bars squeeze in on the intro, open on the drop -->
      <i data-hf-id="hf-axax" id="bars-top"></i><i data-hf-id="hf-48g7" id="bars-bot"></i>

{{WORDS}}
      </div>

      <div data-hf-id="hf-v1e9" class="beat clip" id="b-arrow" data-start="{{FADE}}" data-duration="1.2" data-track-index="4">
        <svg data-hf-id="hf-azd5" class="fx" id="cta-arrow" viewBox="0 0 1080 1920">
          <path data-hf-id="hf-uqev" id="cta-shaft" d="M 330 640 C 180 860 120 1180 160 1440" />
          <path data-hf-id="hf-ryhr" id="cta-head" d="M 80 1360 L 160 1450 L 250 1370" />
        </svg>
      </div>

      <div data-hf-id="hf-hmg5" id="flash"></div>
      <div data-hf-id="hf-0bt9" id="wm"><span data-hf-id="hf-4vsq">สงวนลิขสิทธิ์ช่อง rizanntry ห้ามคัดลอก/ดัดแปลง</span></div>

      <audio data-hf-id="hf-m242" id="bgm" src="assets/shared/bgm_phonk.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="11" data-volume="0.9" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:1},{&quot;t&quot;:{{FADE}},&quot;v&quot;:1},{&quot;t&quot;:{{TOTAL}},&quot;v&quot;:0}]}]}"></audio>
{{SFX}}
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const flash = HF.flash(tl);
      const BEATS = {{BEATS}};

      // every shot: hard cut + a punch-zoom that settles inside the beat
      [{{SHOTS}}].forEach(([s, d, z0, z1], i) => {
        tl.fromTo(`#k${i}`, { scale: z0 }, { scale: z1, duration: d, ease: "power2.out" }, s);
      });
      // micro punch on every strong beat across the build and features
      BEATS.forEach((t, n) => {
        if (n >= 8 && n < 48 && n % 2 === 0) tl.fromTo("#stage", { scale: 1.035 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
      });

      // letterbox: closes on the intro, snaps open on the drop
      tl.fromTo(["#bars-top", "#bars-bot"], { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.to(["#bars-top", "#bars-bot"], { scaleY: 0, duration: 0.18, ease: "expo.in" }, BEATS[16] - 0.18);

      // words on the beat
      [{{WORDSJS}}].forEach(([sel, t, ent]) => {
        if (ent === "slam") tl.fromTo(sel, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out" }, t);
        else if (ent === "stretch") tl.fromTo(sel, { scaleX: 2.2, scaleY: 0.4, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, t);
        else tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
      });

      {{FLASH}}.forEach((t) => flash(t, 0.85, 0.22));
      {{SHAKE}}.forEach((t) => [24, -20, 16, -12, 8, -4, 0].forEach((x, i) => tl.set("#stage", { x, y: -x * 0.4 }, t + i * 0.035)));

      const sl = HF.dash($("#cta-shaft"));
      const hl = HF.dash($("#cta-head"));
      tl.fromTo("#cta-shaft", { strokeDashoffset: sl }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, {{FADE}});
      tl.fromTo("#cta-head", { strokeDashoffset: hl }, { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" }, {{FADE}} + 0.28);

      window.__timelines["ess02-hype-25s"] = tl;
    </script>
  </body>
</html>
