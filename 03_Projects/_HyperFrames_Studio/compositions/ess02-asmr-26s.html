    <script>
      const tl = gsap.timeline({ paused: true });
      // slow pushes + 0.3s dissolve between shots (each cam overlaps the previous one)
      const SHOTS = [[0, 4.3, 1.08, 1.2], [4.0, 4.3, 1.6, 1.75], [8.0, 3.8, 1.35, 1.48], [11.5, 3.8, 1.75, 1.9], [15.0, 3.8, 1.45, 1.58], [18.5, 4.3, 1.1, 1.2], [22.5, 4.0, 1.12, 1.24]];
      SHOTS.forEach(([s, d, z0, z1], i) => {
        tl.fromTo(`#k${i}`, { scale: z0 }, { scale: z1, duration: d, ease: "none" }, s);
        if (i > 0) tl.fromTo(`#c${i}`, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.inOut" }, s);
      });
      // notes breathe in and out, no slams
      const note = (sel, t0, t1) => {
        tl.fromTo(sel, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "sine.out" }, t0);
        tl.to(sel, { opacity: 0, duration: 0.5, ease: "sine.in" }, t1 - 0.5);
      };
      note("#n-asmr", 0.4, 3.6);
      note("#n1", 1.2, 3.9);
      note("#n2", 5.0, 7.9);
      note("#n3", 12.2, 15.0);
      note("#n4", 15.8, 18.4);
      note("#n5", 19.3, 22.4);
